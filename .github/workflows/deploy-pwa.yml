name: Deploy PWA to GitHub Pages

# Wymaga Settings -> Pages -> Source: "GitHub Actions" (nie "Deploy from a branch").
# 2026-09-04: build_type ustawiony na "workflow" przez API (byl "legacy"/branch mimo UI) - retrigger.

on:
  push:
    branches: [master]
    paths:
      - "pwa/**"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa
      - id: deployment
        uses: actions/deploy-pages@v4
