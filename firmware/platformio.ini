; G100 Programator — ESP32 gateway BLE GATT <-> Modbus RTU
; Patrz: ../extracted/G100_Programator_SPEC.md

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.5.1
    bblanchon/ArduinoJson @ ^7.0.4
build_flags =
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

; Wgrywanie firmware przez WiFi (OTA), bez kabla — wymaga: (1) firmware z
; obsługą OTA już wgrany raz przez USB, (2) ESP32 tworzy WŁASNY WiFi AP
; (domyślnie SSID "G100-Programator-OTA", patrz include/config.h /
; wifi_secrets.h.example), włączany na żądanie z telefonu (przycisk
; "Włącz OTA" w panelu Debug PWA), (3) komputer musi być POŁĄCZONY z tym AP
; w momencie uploadu.
;
; CELOWO NIE espota/ArduinoOTA — ten protokół wymaga żeby ESP32 "oddzwoniło"
; (połączenie zwrotne TCP) do komputera, co Windows Firewall na sieci
; publicznej blokuje domyślnie (naprawa wymaga uprawnień administratora,
; niewygodne w praktyce — sprawdzone empirycznie 2026-09-08). Zamiast tego
; firmware wystawia zwykły HTTP POST /update (patrz main.cpp) — komputer
; robi tylko połączenie WYCHODZĄCE, którego Windows nigdy nie blokuje.
;
; Użycie (najpierw normalny build): pio run -t buildfs 2>NUL & pio run
; potem wgranie:
;   curl -F "firmware=@.pio/build/esp32dev/firmware.bin" http://192.168.4.1/update
; Jeśli ustawiono OTA_PASSWORD w wifi_secrets.h, dopisz:
;   -H "X-OTA-Password: TWOJE_HASLO"
; 192.168.4.1 to domyślny adres gateway ESP32 w trybie AP (stały, nie
; zależy od mDNS/.local — na Windowsie rozpoznawanie .local bywa zawodne).
