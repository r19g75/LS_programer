; G100 Programator — ESP32 gateway BLE GATT <-> Modbus RTU
; Patrz: ../extracted/G100_Programator_SPEC.md

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.5.1
    bblanchon/ArduinoJson @ ^7.0.4
build_flags =
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

; Wgrywanie firmware przez WiFi (OTA), bez kabla — wymaga: (1) firmware z
; obsługą OTA już wgrany raz przez USB, (2) ESP32 połączony z WiFi (patrz
; include/wifi_secrets.h.example), (3) telefon/PC w tej samej sieci.
; Użycie: pio run -e esp32dev_ota -t upload
; Jeśli w wifi_secrets.h ustawiono OTA_PASSWORD, dopisz do upload_flags
; poniżej linię "--auth=TWOJE_HASLO" (nie commitować hasła do repo).
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = g100-programator.local
